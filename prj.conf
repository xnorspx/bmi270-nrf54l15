# BMI270 IMU reader on XIAO nRF54L15

CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# the shell would interleave its prompt with the CSV stream, so the app does
# its own line-based command parsing on the console UART instead
CONFIG_SHELL=n

CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=4096

# this board's default is single-threaded, which compiles k_sem out entirely
# (undefined z_impl_k_sem_take / give / reset at link time)
CONFIG_MULTITHREADING=y

# This Zephyr revision declares parameterised (shared) interrupts on nRF54L15,
# and gen_isr_tables.py refuses to build without the software ISR table:
#   "Regular Interrupt 261 declared with parameter ... but no SW ISR_TABLE"
CONFIG_GEN_SW_ISR_TABLE=y

# also build without sysbuild, there is no immutable bootloader or TF-M here

# ------------------------------------------------------------------ Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="KneeChe IMU"

# 247-byte MTU + data length extension: 14 samples per notification
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_ATT_TX_COUNT=4
CONFIG_BT_RX_STACK_SIZE=2048

# must be greater than BT_BUF_ACL_TX_COUNT
CONFIG_BT_BUF_EVT_RX_COUNT=24
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=8

